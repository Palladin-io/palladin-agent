  '''^runtime/contracts/vault-v2/fixtures/v2/vectors/key-derivation\.json$''',
  '''^runtime/contracts/vault-v2/fixtures/v2/vectors/pairing\.json$''',
  '''^runtime/contracts/vault-v2/fixtures/v2/vectors/rotation\.json$''',
  '''^runtime/contracts/vault-v2/fixtures/v2/vectors/signatures\.json$''',
  '''^runtime/crates/palladin-platform/src/broker_protocol\.rs$''',
  '''^runtime/crates/palladin-platform/src/secure_store\.rs$''',
  '''^runtime/crates/palladin-windows-broker/src/windows_store\.rs$''',
