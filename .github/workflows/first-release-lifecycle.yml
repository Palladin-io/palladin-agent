name: Owner-only first-release physical lifecycle

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: "Draft candidate release tag"
        required: true
        type: string
      candidate_version:
        description: "Exact first-release version (0.0.1)"
        required: true
        type: string
      candidate_source_sha:
        description: "Candidate source commit"
        required: true
        type: string
      confirmation:
        description: "Type: run physical lifecycle gate"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: palladin-first-release-lifecycle
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize immutable physical test inputs
    if: github.actor == 'patryk-roguszewski' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: lifecycle-qa
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: verify
        name: Verify owner, commits, versions, tags, and draft boundary
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_source_sha }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = 'run physical lifecycle gate'
          test "$CANDIDATE_SHA" = "$GITHUB_SHA"
          test "$CANDIDATE_VERSION" = 0.0.1
          test "$CANDIDATE_TAG" = v0.0.1
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
          git fetch --force --no-tags origin "refs/tags/$CANDIDATE_TAG:refs/tags/$CANDIDATE_TAG"
          test "$(git rev-parse "$CANDIDATE_TAG^{commit}")" = "$CANDIDATE_SHA"
          candidate=$(gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName)
          test "$(jq -r .isDraft <<<"$candidate")" = true
          test "$(jq -r .tagName <<<"$candidate")" = "$CANDIDATE_TAG"
          echo "source_sha=$CANDIDATE_SHA" >>"$GITHUB_OUTPUT"
      - name: Download and bind the immutable first release set
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          INPUTS_CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          INPUTS_CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/lifecycle-release-sets/candidate"
          mkdir -m 700 "$RUNNER_TEMP/lifecycle-release-sets"
          mkdir -m 700 "$directory"
          gh release download "$INPUTS_CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$directory"
          node -e '
            const fs = require("node:fs");
            const [platformPath, agentPath, version, sourceSha] = process.argv.slice(1);
            for (const path of [platformPath, agentPath]) {
              const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
              if (manifest.version !== version || manifest.sourceSha !== sourceSha || !Array.isArray(manifest.artifacts)) process.exit(1);
            }
          ' "$directory/release-manifest.json" "$directory/release-manifest-agent.json" "$INPUTS_CANDIDATE_VERSION" "$INPUTS_CANDIDATE_SOURCE_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: physical-release-sets-${{ steps.verify.outputs.source_sha }}
          path: ${{ runner.temp }}/lifecycle-release-sets/**
          if-no-files-found: error
          retention-days: 7

  macos:
    name: Physical lifecycle - ${{ matrix.target }}
    needs: authorize
    if: needs.authorize.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: '["self-hosted","palladin-lifecycle","macos","arm64"]'
          - target: macos-x64
            runner: '["self-hosted","palladin-lifecycle","macos","x64"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    environment: lifecycle-qa
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # sign the lifecycle report through workload identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ github.sha }}', persist-credentials: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: 24, package-manager-cache: false }
      - run: npm install --global npm@11.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: 'physical-release-sets-${{ needs.authorize.outputs.source_sha }}', path: '${{ runner.temp }}/lifecycle-release-sets' }
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_LIFECYCLE_QA_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with: { version: 561.0.0 }
      - name: Require native interactive macOS hardware
        run: |
          set -euo pipefail
          test "$(stat -f '%Su' /dev/console)" = "$USER"
          test "$(sysctl -in sysctl.proc_translated 2>/dev/null || echo 0)" = 0
          test "$(uname -m)" = "${{ matrix.target == 'macos-arm64' && 'arm64' || 'x86_64' }}"
      - name: Run the secret-safe lifecycle
        env:
          PALLADIN_APPLICATION_IDENTIFIER: ${{ vars.PALLADIN_MACOS_APPLICATION_IDENTIFIER }}
          PALLADIN_KEYCHAIN_ACCESS_GROUP: ${{ vars.PALLADIN_MACOS_KEYCHAIN_ACCESS_GROUP }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          contract="$RUNNER_TEMP/contract-$TARGET.json"
          output="$RUNNER_TEMP/lifecycle-$TARGET.json"
          node security/lifecycle/write-run-contract.mjs --manifest security/lifecycle/first-release-manifest.json --target "$TARGET" --release-sets "$RUNNER_TEMP/lifecycle-release-sets" --source-sha '${{ needs.authorize.outputs.source_sha }}' --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --vault-id '${{ vars.PALLADIN_LIFECYCLE_QA_VAULT_ID }}' --entry-id '${{ vars.PALLADIN_LIFECYCLE_QA_ENTRY_ID }}' --output "$output" --contract "$contract"
          gcloud secrets versions access latest --secret='${{ vars.PALLADIN_LIFECYCLE_QA_SECRET }}' | node security/lifecycle/run-physical-target.mjs "$contract"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: 'lifecycle-${{ matrix.target }}', path: '${{ runner.temp }}/lifecycle-${{ matrix.target }}.json', if-no-files-found: error, retention-days: 7 }

  linux:
    name: Physical lifecycle - ${{ matrix.target }}
    needs: authorize
    if: needs.authorize.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: ubuntu-24.04-arm64, runner: '["self-hosted","palladin-lifecycle","ubuntu-24.04","arm64"]', distro: ubuntu, version: '24.04', machine: aarch64 }
          - { target: ubuntu-24.04-x64, runner: '["self-hosted","palladin-lifecycle","ubuntu-24.04","x64"]', distro: ubuntu, version: '24.04', machine: x86_64 }
          - { target: alpine-3.22-arm64, runner: '["self-hosted","palladin-lifecycle","alpine-3.22","arm64"]', distro: alpine, version: '3.22', machine: aarch64 }
          - { target: alpine-3.22-x64, runner: '["self-hosted","palladin-lifecycle","alpine-3.22","x64"]', distro: alpine, version: '3.22', machine: x86_64 }
    runs-on: ${{ fromJSON(matrix.runner) }}
    environment: lifecycle-qa
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # sign the lifecycle report through workload identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ github.sha }}', persist-credentials: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: 24, package-manager-cache: false }
      - run: npm install --global npm@11.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: 'physical-release-sets-${{ needs.authorize.outputs.source_sha }}', path: '${{ runner.temp }}/lifecycle-release-sets' }
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_LIFECYCLE_QA_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with: { version: 561.0.0 }
      - name: Require exact native Linux VM
        env: { EXPECTED_ID: '${{ matrix.distro }}', EXPECTED_VERSION: '${{ matrix.version }}', EXPECTED_MACHINE: '${{ matrix.machine }}' }
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = "$EXPECTED_ID"
          [[ "$VERSION_ID" == "$EXPECTED_VERSION" || "$VERSION_ID" == "$EXPECTED_VERSION".* ]]
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          if grep -Eqi 'qemu|emulat' /proc/cpuinfo; then exit 1; fi
          if [ "$EXPECTED_ID" != alpine ]; then test "$(systemd --version | awk 'NR==1 {print $2}')" -ge 252; fi
      - name: Run the secret-safe lifecycle
        env: { TARGET: '${{ matrix.target }}' }
        run: |
          set -euo pipefail
          contract="$RUNNER_TEMP/contract-$TARGET.json"
          output="$RUNNER_TEMP/lifecycle-$TARGET.json"
          node security/lifecycle/write-run-contract.mjs --manifest security/lifecycle/first-release-manifest.json --target "$TARGET" --release-sets "$RUNNER_TEMP/lifecycle-release-sets" --source-sha '${{ needs.authorize.outputs.source_sha }}' --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --vault-id '${{ vars.PALLADIN_LIFECYCLE_QA_VAULT_ID }}' --entry-id '${{ vars.PALLADIN_LIFECYCLE_QA_ENTRY_ID }}' --output "$output" --contract "$contract"
          gcloud secrets versions access latest --secret='${{ vars.PALLADIN_LIFECYCLE_QA_SECRET }}' | node security/lifecycle/run-physical-target.mjs "$contract"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: 'lifecycle-${{ matrix.target }}', path: '${{ runner.temp }}/lifecycle-${{ matrix.target }}.json', if-no-files-found: error, retention-days: 7 }

  aggregate:
    name: Aggregate all six first-release physical shards
    if: always() && github.actor == 'patryk-roguszewski'
    needs: [authorize, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - name: Require every target job to pass
        env: { AUTHORIZE: '${{ needs.authorize.result }}', MACOS: '${{ needs.macos.result }}', LINUX: '${{ needs.linux.result }}' }
        run: test "$AUTHORIZE" = success && test "$MACOS" = success && test "$LINUX" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ github.sha }}', persist-credentials: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: 24, package-manager-cache: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { pattern: 'lifecycle-*', path: '${{ runner.temp }}/lifecycle-shards', merge-multiple: true }
      - name: Generate and validate the fail-closed report
        run: |
          set -euo pipefail
          test "$(find "$RUNNER_TEMP/lifecycle-shards" -maxdepth 1 -type f -name 'lifecycle-*.json' | wc -l | tr -d ' ')" = 6
          node security/lifecycle/aggregate-shards.mjs --manifest security/lifecycle/first-release-manifest.json --shards "$RUNNER_TEMP/lifecycle-shards" --source-sha '${{ needs.authorize.outputs.source_sha }}' --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --output "$RUNNER_TEMP/lifecycle-evidence.json"
          node security/lifecycle/report.mjs generate --manifest security/lifecycle/first-release-manifest.json --evidence "$RUNNER_TEMP/lifecycle-evidence.json" --source-sha '${{ needs.authorize.outputs.source_sha }}' --json "$RUNNER_TEMP/lifecycle-report.json" --markdown "$RUNNER_TEMP/lifecycle-report.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifecycle-report-${{ needs.authorize.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/lifecycle-report.json
            ${{ runner.temp }}/lifecycle-report.md
          if-no-files-found: error
          retention-days: 7

  attach-report:
    name: Attach the verified report to the candidate draft
    needs: [authorize, aggregate]
    runs-on: ubuntu-latest
    environment: lifecycle-qa
    timeout-minutes: 8
    permissions:
      contents: write # attach the validated lifecycle report to the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ github.sha }}', persist-credentials: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: 24, package-manager-cache: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: 'lifecycle-report-${{ needs.authorize.outputs.source_sha }}', path: '${{ runner.temp }}/lifecycle-report' }
      - name: Revalidate and upload without replacement
        env: { GH_TOKEN: "${{ github.token }}", INPUTS_CANDIDATE_TAG: "${{ inputs.candidate_tag }}" }
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/lifecycle-report"
          node security/lifecycle/report.mjs validate --manifest security/lifecycle/first-release-manifest.json --source-sha '${{ needs.authorize.outputs.source_sha }}' --json "$report/lifecycle-report.json" --markdown "$report/lifecycle-report.md"
          test "$(gh release view "${INPUTS_CANDIDATE_TAG}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload "${INPUTS_CANDIDATE_TAG}" "$report/lifecycle-report.json" "$report/lifecycle-report.md" --repo "$GITHUB_REPOSITORY"
